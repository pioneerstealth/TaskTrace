<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check JavaScript</title>
</head>
<body>
    <noscript>
        <p style="color: red;">JavaScript is disabled in your browser.</p>
    </noscript>

    <script>
        document.write("<p>JavaScript is enabled in your browser.</p>");
    </script>
</body>
</html>
